[project]
name = "parcoblatta"
version = "0.1.0"
description = "A treesitter kafka publisher for code analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.25.1",
    "tree-sitter-python>=0.23.6",
]

[project.scripts]
parcoblatta = "parcoblatta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "D",
]
