[project]
name = "parcoblatta"
version = "0.4.0"
description = "A treesitter kafka publisher for code analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.11.1",
    "jinja2>=3.1.0",
    "pydantic>=2.11.7",
    "typer>=0.20.0",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.25.1",
    "tree-sitter-python>=0.23.6",
]

[project.optional-dependencies]
debug = [
    "rich>=15.0.0",
]

[project.scripts]
parcoblatta = "parcoblatta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "D",
]

[tool.ruff.lint.per-file-ignores]
"src/parcoblatta/config/*.py" = ["TC001", "TC003"]
"src/parcoblatta/models.py" = ["TC003"]
