code:
  file: src/parcoblatta

rules:
  query:
    file: queries/flow/functions.scm

  prompt:
    #format: openai
    model: gpt-4.1
    text: |
      Review this $language match from $file.

      Query: $query

      Compact context:
      $compact_text

    schema:
      reason:
        type: string
      keep:
        type: boolean
        required: true

    output:
      file: prompts.jsonl
